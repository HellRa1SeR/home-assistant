  # ==========================================================================
  # WEATHER  (hidden subview)
  # ==========================================================================
  - title: Weather
    path: weather
    icon: mdi:weather-partly-cloudy
    subview: true
    type: sections
    max_columns: 2
    badges:
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            content: Back
            icon: mdi:arrow-left
            tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/main
            card_mod:
              style: |
                ha-card {
                  --chip-background: var(--md-sys-color-primary);
                  --color: var(--md-sys-color-on-primary);
                  --text-color: var(--md-sys-color-on-primary);
                }
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Forecast
          - type: custom:clock-weather-card-hui-icons
            entity: weather.klou
            sun_entity: sun.sun
            temperature_sensor: sensor.klou_temperature
            forecast_rows: 7
            locale: en-US
            time_format: 12
            hide_today_section: false
            hide_forecast_section: false
            hide_clock: false
            hide_date: false
            show_humidity: true
            use_browser_time: true
          - type: weather-forecast
            entity: weather.klou
            forecast_type: hourly
            show_current: true
            show_forecast: true
      - type: grid
        cards:
          - type: heading
            heading: Conditions
          - type: custom:mushroom-template-card
            primary: Air Quality
            secondary: Add an AQI sensor entity to populate this card
            icon: mdi:air-filter
            icon_color: grey
          - type: entities
            title: Details
            entities:
              - entity: sensor.klou_temperature
                name: Outdoor Temperature
              - type: attribute
                entity: weather.klou
                attribute: humidity
                name: Humidity
                icon: mdi:water-percent
              - type: attribute
                entity: weather.klou
                attribute: wind_speed
                name: Wind Speed
                icon: mdi:weather-windy
              - type: attribute
                entity: weather.klou
                attribute: pressure
                name: Pressure
                icon: mdi:gauge
            state_color: false

