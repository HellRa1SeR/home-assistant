# =============================================================================
# Material Design 3 Tablet Dashboard  (new build)
# -----------------------------------------------------------------------------
# IMPORTANT — dashboard URL slug:
#   All in-dashboard navigation below uses "/family-foyer-beta/<page>", matching the
#   dashboard you created (URL: /family-foyer-beta). If the first segment of your
#   browser's address bar is different, find/replace  /family-foyer-beta/  with
#   /<your-actual-slug>/  in every navigation_path.
#
# Pages (views):
#   - Main      (path: main)      -> the default 3x4 grid, always shown
#   - Weather   (path: weather)   -> hidden subview, opened from the top tabs
#   - Cameras   (path: cameras)   -> hidden subview
#   - Security  (path: security)  -> hidden subview
# Each subview has a native back arrow (subview: true) plus a back chip.
#
# Requires (all already installed per your HACS list): mushroom, card-mod,
#   layout-card (grid-layout), stack-in-card, decluttering-card,
#   advanced-camera-card, calendar-card-pro, clock-weather-card-hui-icons,
#   alarmo-card.
#
# NOTE: a few entities are best-guesses / placeholders because your entity
#   list has no matching sensor (called out at the bottom of the chat reply):
#   room temp/humidity for Garage/Loft/Patio, patio light, AQI sensor.
# =============================================================================

decluttering_templates:
  # Room name + free-form status line (black text, no icon) - top-left of a room tile
  room_summary_card:
    default:
      - room_name: Room
      - secondary: ""
    card:
      type: custom:mushroom-template-card
      primary: "[[room_name]]"
      secondary: "[[secondary]]"
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      card_mod:
        style:
          .: |
            ha-card {
              --primary-text-color: black;
              border: 0px;
              padding-left: 5px;
              padding-top: 5px;
              width: 500px;
            }
          mushroom-state-info$: |
            .container {
              --card-primary-color: var(--primary-text-color);
              --card-secondary-color: var(--primary-text-color);
            }

  # Large circular icon that toggles a light/switch - bottom-left of a room tile
  big_icon_toggle_card:
    default:
      - entity: switch.example
      - icon: mdi:home
    card:
      type: custom:mushroom-template-card
      entity: "[[entity]]"
      layout: horizontal
      icon: "[[icon]]"
      icon_color: |-
        {% if is_state(entity, 'on') %}
          #ecce85
        {% else %}
          #5b5b5b
        {% endif %}
      tap_action:
        action: toggle
      hold_action:
        action: none
      double_tap_action:
        action: none
      primary_info: none
      secondary_info: none
      card_mod:
        style:
          ha-tile-icon$: |
            .container {
              border: 0px;
              width: 120px !important;
              height: 120px !important;
              border-radius: 50% !important;
            }
          .: |
            ha-tile-icon {
              --mdc-icon-size: 90px !important;
            }
            ha-card {
              border: none;
              margin-top: -8px !important;
              margin-left: -24px !important;
            }

  # A single camera tile (advanced-camera-card) with fixed height
  camera_tile:
    default:
      - camera_entity: camera.example
      - height: 150px
    card:
      type: custom:advanced-camera-card
      cameras:
        - camera_entity: "[[camera_entity]]"
      card_mod:
        style: |
          ha-card {
            height: [[height]];
            overflow: hidden;
            border-radius: 20px;
          }

views:
  # ==========================================================================
  # MAIN  (default view)  -  top nav tabs + 3 rows x 4 columns
  # ==========================================================================
  - title: Main
    path: main
    icon: mdi:home-outline
    type: custom:grid-layout
    layout:
      grid-template-columns: 25% 25% 25% 25%
      grid-template-rows: min-content auto auto auto
      grid-gap: 8px
      grid-template-areas: |
        "nav  nav  nav  nav"
        "r1c1 r1c2 r1c3 r1c4"
        "r2c1 r2c2 r2c3 r2c4"
        "r3c1 r3c2 r3c3 r3c4"
    cards:
      # ---- Top navigation "tabs" -------------------------------------------
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            content: Main
            icon: mdi:view-dashboard
            tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/main
            card_mod:
              style: |
                ha-card {
                  --chip-background: var(--md-sys-color-primary);
                  --color: var(--md-sys-color-on-primary);
                  --text-color: var(--md-sys-color-on-primary);
                }
          - type: template
            content: Weather
            icon: mdi:weather-partly-cloudy
            tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/weather
          - type: template
            content: Cameras
            icon: mdi:cctv
            tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/cameras
          - type: template
            content: Security
            icon: mdi:shield-home
            tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/security
        view_layout:
          grid-area: nav

      # ---- Row 1, Col 1 : Weather + date + time + current temp -------------
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            alignment: start
            title: >-
              {% set h = now().hour %}
              {% if h >= 18 %} Good Evening!
              {% elif h >= 12 %} Good Afternoon!
              {% elif h >= 5 %} Good Morning!
              {% else %} Welcome! {% endif %}
            subtitle: "{{ now().strftime('%A, %b %-d · %-I:%M %p') }}"
          - type: custom:clock-weather-card-hui-icons
            entity: weather.klou
            sun_entity: sun.sun
            temperature_sensor: sensor.klou_temperature
            forecast_rows: 5
            locale: en-US
            time_format: 12
            hide_today_section: false
            hide_forecast_section: false
            hide_clock: false
            hide_date: false
            show_humidity: true
            use_browser_time: true
        view_layout:
          grid-area: r1c1

      # ---- Row 1, Col 2 : Thermostat (round dial) --------------------------
      - type: custom:stack-in-card
        cards:
          - type: thermostat
            entity: climate.thermostat
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - cool
                  - heat
                  - fan_only
                  - "off"
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:thermometer
                content: "{{ states('sensor.thermostat_air_temperature') | round(1) }}°"
              - type: template
                icon: mdi:water-percent
                content: "{{ states('sensor.thermostat_humidity') | round(0) }}%"
        view_layout:
          grid-area: r1c2

      # ---- Row 1, Col 3 : Calendar -----------------------------------------
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Calendar
            title_tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/main
          - type: custom:calendar-card-pro
            entities:
              - entity: calendar.sid_and_smruti_s_calendar
                accent_color: "#ff6a6a"
            days_to_show: 6
            compact_events_to_show: 5
            background_color: transparent
            vertical_line_width: 5px
            first_day_of_week: monday
            today_indicator: pulse
            today_indicator_color: var(--md-sys-color-primary)
            show_countdown: true
            weather:
              position: date
              entity: weather.klou
        view_layout:
          grid-area: r1c3

      # ---- Row 1, Col 4 : Alarm --------------------------------------------
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Security
            title_tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/security
          - type: custom:mushroom-alarm-control-panel-card
            entity: alarm_control_panel.alarmo
            name: Alarm
            states:
              - armed_home
              - armed_away
              - armed_night
            fill_container: false
            tap_action:
              action: navigate
              navigation_path: /family-foyer-beta/security
        view_layout:
          grid-area: r1c4

      # ---- Row 2, Col 1 : Garage + Living Room -----------------------------
      - type: vertical-stack
        cards:
          # --- Garage ---
          - type: custom:stack-in-card
            mode: horizontal
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:decluttering-card
                    template: room_summary_card
                    variables:
                      - room_name: Garage
                      - secondary: >-
                          {{ 'Door Open' if is_state('binary_sensor.garage_door_opening','on') else 'Door Closed' }}
                  - type: custom:decluttering-card
                    template: big_icon_toggle_card
                    variables:
                      - entity: switch.lawn_showlight
                      - icon: mdi:garage-variant
              - type: custom:mushroom-chips-card
                chips:
                  - type: template
                    entity: switch.lawn_showlight
                    icon: mdi:outdoor-lamp
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('switch.lawn_showlight','on') %} #D3C890 {% else %} #353535 {% endif %};
                          --color: {% if is_state('switch.lawn_showlight','on') %} #5b5326 {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                  - type: template
                    entity: binary_sensor.garage_door_opening
                    icon: >-
                      {{ 'mdi:garage-open' if is_state('binary_sensor.garage_door_opening','on') else 'mdi:garage' }}
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('binary_sensor.garage_door_opening','on') %} #bc000a {% else %} #353535 {% endif %};
                          --color: {% if is_state('binary_sensor.garage_door_opening','on') %} #ffffff {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                card_mod:
                  style: |
                    .chip-container {
                      flex-flow: column wrap-reverse !important;
                      display: flex !important;
                      --chip-spacing: 8px;
                      margin: 12px;
                    }
            card_mod:
              style: |
                ha-card {
                  background: rgba(200, 200, 200, 0.35);
                  max-width: 100%; min-width: 50%; height: 150px; border-radius: 20px;
                }
          # --- Living Room ---
          - type: custom:stack-in-card
            mode: horizontal
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:decluttering-card
                    template: room_summary_card
                    variables:
                      - room_name: Living Room
                      - secondary: >-
                          {{ states('sensor.living_room_sensor_temperature') | round(1) }}°F /
                          {{ states('sensor.living_room_sensor_humidity') | round(0) }}%
                  - type: custom:decluttering-card
                    template: big_icon_toggle_card
                    variables:
                      - entity: light.living_room_lights
                      - icon: mdi:sofa
              - type: custom:mushroom-chips-card
                chips:
                  - type: template
                    entity: light.living_room_lights
                    icon: mdi:light-recessed
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('light.living_room_lights','on') %} #D3C890 {% else %} #353535 {% endif %};
                          --color: {% if is_state('light.living_room_lights','on') %} #5b5326 {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                  - type: template
                    entity: switch.living_room_outlet_switch
                    icon: mdi:power-socket-us
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('switch.living_room_outlet_switch','on') %} #D3C890 {% else %} #353535 {% endif %};
                          --color: {% if is_state('switch.living_room_outlet_switch','on') %} #5b5326 {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                  - type: template
                    entity: switch.christmas_lights
                    icon: mdi:string-lights
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('switch.christmas_lights','on') %} #D3C890 {% else %} #353535 {% endif %};
                          --color: {% if is_state('switch.christmas_lights','on') %} #5b5326 {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                card_mod:
                  style: |
                    .chip-container {
                      flex-flow: column wrap-reverse !important;
                      display: flex !important;
                      --chip-spacing: 8px;
                      margin: 12px;
                    }
            card_mod:
              style: |
                ha-card {
                  background:
                  {% set temp = states('sensor.living_room_sensor_temperature') | float(70) %}
                    {% if temp < 55 %} rgba(172, 156, 175, 0.8)
                    {% elif temp < 61 %} rgba(215, 196, 219, 0.8)
                    {% elif temp < 66 %} rgba(163, 217, 245, 0.8)
                    {% elif temp < 72 %} rgba(205, 227, 219, 0.8)
                    {% elif temp < 75 %} rgba(255, 229, 153, 0.8)
                    {% elif temp < 81 %} rgba(247, 190, 129, 0.8)
                    {% else %} rgba(224, 102, 102, 0.8) {% endif %};
                  max-width: 100%; min-width: 50%; height: 150px; border-radius: 20px;
                }
        view_layout:
          grid-area: r2c1

      # ---- Row 2, Col 2 : Master + Loft ------------------------------------
      - type: vertical-stack
        cards:
          # --- Master ---
          - type: custom:stack-in-card
            mode: horizontal
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:decluttering-card
                    template: room_summary_card
                    variables:
                      - room_name: Master
                      - secondary: >-
                          {{ states('sensor.bedroom_temperature_sensor_temperature') | round(1) }}°F /
                          {{ states('sensor.bedroom_temperature_sensor_humidity') | round(0) }}%
                  - type: custom:decluttering-card
                    template: big_icon_toggle_card
                    variables:
                      - entity: light.master_ceiling_fan
                      - icon: mdi:bed-king
              - type: custom:mushroom-chips-card
                chips:
                  - type: template
                    entity: light.master_ceiling_fan
                    icon: mdi:ceiling-fan-light
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('light.master_ceiling_fan','on') %} #D3C890 {% else %} #353535 {% endif %};
                          --color: {% if is_state('light.master_ceiling_fan','on') %} #5b5326 {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                  - type: template
                    entity: fan.master_ceiling_fan
                    icon: mdi:ceiling-fan
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('fan.master_ceiling_fan','on') %} #9fe7e8 {% else %} #353535 {% endif %};
                          --color: {% if is_state('fan.master_ceiling_fan','on') %} #1c4e4f {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                  - type: template
                    entity: switch.master_bedroom_dresser_light_switch
                    icon: mdi:lamp
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('switch.master_bedroom_dresser_light_switch','on') %} #D3C890 {% else %} #353535 {% endif %};
                          --color: {% if is_state('switch.master_bedroom_dresser_light_switch','on') %} #5b5326 {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                card_mod:
                  style: |
                    .chip-container {
                      flex-flow: column wrap-reverse !important;
                      display: flex !important;
                      --chip-spacing: 8px;
                      margin: 12px;
                    }
            card_mod:
              style: |
                ha-card {
                  background:
                  {% set temp = states('sensor.bedroom_temperature_sensor_temperature') | float(70) %}
                    {% if temp < 55 %} rgba(172, 156, 175, 0.8)
                    {% elif temp < 61 %} rgba(215, 196, 219, 0.8)
                    {% elif temp < 66 %} rgba(163, 217, 245, 0.8)
                    {% elif temp < 72 %} rgba(205, 227, 219, 0.8)
                    {% elif temp < 75 %} rgba(255, 229, 153, 0.8)
                    {% elif temp < 81 %} rgba(247, 190, 129, 0.8)
                    {% else %} rgba(224, 102, 102, 0.8) {% endif %};
                  max-width: 100%; min-width: 50%; height: 150px; border-radius: 20px;
                }
          # --- Loft ---
          - type: custom:stack-in-card
            mode: horizontal
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:decluttering-card
                    template: room_summary_card
                    variables:
                      - room_name: Loft
                      - secondary: >-
                          {{ 'Motion' if is_state('binary_sensor.g3_flex_motion','on') else 'Clear' }} ·
                          Vac {{ states('sensor.loft_l10s_ultra_battery_level') }}%
                  - type: custom:mushroom-template-card
                    entity: vacuum.loft_l10s_ultra
                    layout: horizontal
                    icon: mdi:home-floor-2
                    icon_color: |-
                      {% if is_state('vacuum.loft_l10s_ultra','cleaning') %} #9fe7e8 {% else %} #5b5b5b {% endif %}
                    tap_action:
                      action: more-info
                    primary_info: none
                    secondary_info: none
                    card_mod:
                      style:
                        ha-tile-icon$: |
                          .container {
                            border: 0px; width: 120px !important; height: 120px !important; border-radius: 50% !important;
                          }
                        .: |
                          ha-tile-icon { --mdc-icon-size: 90px !important; }
                          ha-card { border: none; margin-top: -8px !important; margin-left: -24px !important; }
              - type: custom:mushroom-chips-card
                chips:
                  - type: template
                    entity: vacuum.loft_l10s_ultra
                    icon: mdi:robot-vacuum
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('vacuum.loft_l10s_ultra','cleaning') %} #9fe7e8 {% else %} #353535 {% endif %};
                          --color: {% if is_state('vacuum.loft_l10s_ultra','cleaning') %} #1c4e4f {% else %} #dbdbdb {% endif %};
                          justify-content: center; height: 35px !important; width: 35px !important;
                          border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                        }
                card_mod:
                  style: |
                    .chip-container {
                      flex-flow: column wrap-reverse !important;
                      display: flex !important;
                      --chip-spacing: 8px;
                      margin: 12px;
                    }
            card_mod:
              style: |
                ha-card {
                  background: rgba(200, 200, 200, 0.35);
                  max-width: 100%; min-width: 50%; height: 150px; border-radius: 20px;
                }
        view_layout:
          grid-area: r2c2

      # ---- Row 2, Col 3 : Patio & Deck -------------------------------------
      - type: custom:stack-in-card
        mode: horizontal
        cards:
          - type: vertical-stack
            cards:
              - type: custom:decluttering-card
                template: room_summary_card
                variables:
                  - room_name: Patio & Deck
                  - secondary: >-
                      {{ 'Motion Detected' if is_state('binary_sensor.g4_instant_motion','on') else 'All Clear' }}
              - type: custom:decluttering-card
                template: big_icon_toggle_card
                variables:
                  - entity: switch.porch_lights
                  - icon: mdi:table-chair
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: switch.porch_lights
                icon: mdi:string-lights
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      --chip-background: {% if is_state('switch.porch_lights','on') %} #D3C890 {% else %} #353535 {% endif %};
                      --color: {% if is_state('switch.porch_lights','on') %} #5b5326 {% else %} #dbdbdb {% endif %};
                      justify-content: center; height: 35px !important; width: 35px !important;
                      border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                    }
              - type: template
                entity: media_player.deck_speaker
                icon: mdi:speaker
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      --chip-background: #353535;
                      --color: #dbdbdb;
                      justify-content: center; height: 35px !important; width: 35px !important;
                      border: 0 !important; box-shadow: none !important; border-radius: 22px !important;
                    }
            card_mod:
              style: |
                .chip-container {
                  flex-flow: column wrap-reverse !important;
                  display: flex !important;
                  --chip-spacing: 8px;
                  margin: 12px;
                }
        card_mod:
          style: |
            ha-card {
              background: rgba(200, 200, 200, 0.35);
              max-width: 100%; min-width: 50%; height: 150px; border-radius: 20px;
            }
        view_layout:
          grid-area: r2c3

      # ---- Row 2, Col 4 : (intentionally empty) ----------------------------

      # ---- Row 3 : Cameras (Driveway, Baby Cam, Garage, Backyard) ----------
      - type: vertical-stack
        cards:
          - type: custom:decluttering-card
            template: camera_tile
            variables:
              - camera_entity: camera.driveway_medium_resolution_channel
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: switch.driveway_lights
                icon: mdi:outdoor-lamp
                content: Driveway Light
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      --text-color: {{ 'var(--md-sys-color-on-primary)' if is_state('switch.driveway_lights','on') else 'var(--primary-text-color)' }};
                      --color: {{ 'var(--md-sys-color-on-primary)' if is_state('switch.driveway_lights','on') else 'var(--primary-text-color)' }};
                      --chip-background: {{ 'var(--md-sys-color-primary)' if is_state('switch.driveway_lights','on') else 'color-mix(in srgb, var(--md-sys-color-surface-variant) 40%, transparent)' }};
                    }
              - type: template
                entity: light.up_floodlight
                icon: mdi:track-light
                content: Floodlight
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      --text-color: {{ 'var(--md-sys-color-on-primary)' if is_state('light.up_floodlight','on') else 'var(--primary-text-color)' }};
                      --color: {{ 'var(--md-sys-color-on-primary)' if is_state('light.up_floodlight','on') else 'var(--primary-text-color)' }};
                      --chip-background: {{ 'var(--md-sys-color-primary)' if is_state('light.up_floodlight','on') else 'color-mix(in srgb, var(--md-sys-color-surface-variant) 40%, transparent)' }};
                    }
        view_layout:
          grid-area: r3c1

      - type: vertical-stack
        cards:
          - type: custom:decluttering-card
            template: camera_tile
            variables:
              - camera_entity: camera.baby_cam_medium_resolution_channel
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: switch.master_bedroom_dresser_light_switch
                icon: mdi:lamp
                content: Dresser Light
                tap_action:
                  action: toggle
